# Default values for todo-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

backend:
  image:
    # docker hub username is 'hooriyaa'
    repository: hooriyaa/todo-backend
    
    # Azure needs 'Always' to fetch fresh images from Docker Hub
    pullPolicy: Always
    
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 8000
  
  # Environment variables for the backend application.
  # ⚠️ SECRETS REMOVED: These are now empty. Pass them securely via Helm command or Kubernetes Secrets.
  env:
    - name: GEMINI_API_KEY
      value: ""  # 👈 Key removed for security
    - name: GOOGLE_API_KEY
      value: ""  # 👈 Key removed for security
    - name: DATABASE_URL
      value: "sqlite:///app/todo.db"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  image:
    # docker hub username is 'hooriyaa'
    repository: hooriyaa/todo-frontend
    
    # Azure needs 'Always' to fetch fresh images from Docker Hub
    pullPolicy: Always
    
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
  env:
    - name: NEXT_PUBLIC_API_URL
      value: "http://172.184.237.143:8000"
    - name: VITE_API_URL
      value: "http://172.184.237.143:8000"
    - name: REACT_APP_API_URL
      value: "http://172.184.237.143:8000"
    - name: API_URL
      value: "http://172.184.237.143:8000"
    - name: BETTER_AUTH_SECRET
      value: "dummy-auth-secret"
    - name: BETTER_AUTH_URL
      value: "http://172.184.237.143:8000"
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: todo.local
      paths:
        - path: /api
          pathType: Prefix
          backendService: backend-service
          backendPort: 8000
        - path: /
          pathType: Prefix
          backendService: frontend-service
          backendPort: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

secrets:
  # These values will be used to create the Kubernetes secrets
  # They should be provided externally or generated during installation
  databaseUrl: "sqlite:///app/todo.db"
  geminiApiKey: "" # 👈 Key removed for security
  betterAuthSecret: "dummy-auth-secret"