# Default values for todo-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

backend:
  image:
    repository: todo-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30   # Give it 30s to start
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  image:
    repository: todo-frontend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
  env:
    - name: NEXT_PUBLIC_API_URL
      value: "http://todo.local/api"
    - name: VITE_API_URL
      value: "http://todo.local/api"
    - name: REACT_APP_API_URL
      value: "http://todo.local/api"
    - name: API_URL
      value: "http://todo.local/api"
    - name: BETTER_AUTH_SECRET
      value: "dummy-auth-secret"
    - name: BETTER_AUTH_URL
      value: "http://todo.local"
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: todo.local
      paths:
        - path: /api
          pathType: Prefix
          backendService: backend-service
          backendPort: 8000
        - path: /
          pathType: Prefix
          backendService: frontend-service
          backendPort: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

secrets:
  # These values will be used to create the Kubernetes secrets
  # They should be provided externally or generated during installation
  databaseUrl: "sqlite:///app/todo.db"
  geminiApiKey: "dummy-gemini-key"
  betterAuthSecret: "dummy-auth-secret"