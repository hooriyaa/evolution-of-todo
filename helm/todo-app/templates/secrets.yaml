apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.secret.name" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.geminiApiKey }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.betterAuthSecret }}
  better-auth-secret: {{ .Values.secrets.betterAuthSecret | b64enc | quote }}
  {{- end }}