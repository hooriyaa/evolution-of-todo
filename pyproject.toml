[project]
name = "hackathon2-backend"
version = "0.1.0"
description = "Backend for the Hackathon2 Full-Stack Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.5.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.6",
    "openai-agents-sdk>=0.1.0",
    "google-generativeai>=0.4.0",
    "pytz>=2023.3"
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "httpx>=0.25.0",
]
