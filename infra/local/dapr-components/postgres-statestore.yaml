apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: postgres-statestore
  namespace: default
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    value: "host=postgres user=postgres password=postgres dbname=todo port=5432 connect_timeout=10"
  - name: tableName
    value: "dapr_state_store"
  - name: actorStateStore
    value: "true"
  - name: concurrency
    value: "first-write"